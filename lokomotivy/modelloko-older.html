'mz-ragulin':{th:2,x:'<p><i>Autor: Petr Ševčík</i></p><h3>Porovnání stejných modelů T679.2 ČSD v měřítkách H0, TT, N</h3><p>U největšího a nejmenšího měřítka jde skoro o dvojnásobnou velikost. Každé má něco do sebe, posuďte.</p><h3>Přestavba lokomotivy T679.2 ČSD v měřítku N</h3><p>Přestavba se nabízí, pokud jste si pořídili magazín Lokomotivy světa 47/2012 s přílohou – nepojízdným výliskem Ragulina. Stačí najít vhodný pojezd; tady posloužil starý model Nohabky od PIKO. Dalo to práci, ale výsledek stojí za to a vedle větších bratříčků se neztratí.</p>',

'mz-sergej2':{th:1,x:'<p><i>Autor: F. Krása</i></p><h3>Digitalizace</h3><p>Lokomotiva dostala dekodér Zimo MX621N. Vážení: Trix 102 g, Fleischmann 73 g. První dekodér při nastavování CV selhal, po výměně za stejný typ už vše fungovalo.</p><h3>Testy na kolejišti</h3><p>Na domácím kolejišti modeláře Honzy Merhauta jsme sestavili soupravu ze 4 vozů Y Arnold, 3 vozů Alex Arnold a 7 vozů Railjet Hobbytrain. Nejnáročnější byly oblouky R2 (240 mm) a R3 za stoupáním. Testovali jsme pět lokomotiv:</p><ul><li>Sergej Trix, kat. č. 12358 – 102 g</li><li>Sergej Fleischmann, kat. č. 725202 – 73 g</li><li>Taurus Fleischmann, kat. č. 731214 – 80 g</li><li>Herkules Fleischmann, kat. č. 726012 – 79 g</li><li>Bastard Kühn, kat. č. 95012 – 64 g</li></ul><h3>Výsledky</h3><ol><li>Taurus a Herkules projeli celou trať se soupravou bez problémů.</li><li>Sergej Trix projel vše, na exponovaných místech zpomalil, ale neprokluzoval; jezdí celkově pomalu.</li><li>Sergej Fleischmann a Bastard citelně prokluzovali kvůli nízké hmotnosti.</li></ol><h3>Závěr</h3><p>Pod motor Sergeje Fleischmanna by šla doplnit zátěž. Dekodér leží přímo nad velkým motorem, proto stojí za úvahu originální dekodér s kablíkem, hlavně kvůli přehřívání. Poškození prvního dekodéru s přehřátím nesouviselo.</p><p>Děkujeme Honzovi Merhautovi za nastavení vlastností a testovací jízdy.</p>',
 i:gi(R+'porovnani_sergej_n_trix_a_fleischmann_ii_39','porovnn_sergej_n_ii_20141217_',[1725550331,1194455617,1238556607,1165772582])},
'mz-sergej1':{th:6,x:'<p><i>Autor: F. Krása</i></p><p>Konečně jsem se dostal ke druhému Sergejovi, od Fleischmannu (kat. č. 725202). Pro porovnání posloužil Sergej od Trixu (kat. č. 12358 DR), mírně upravený do podoby ČSD T679.1329.</p><h3>Popis</h3><p>V krabičce jsou náhradní spřáhla Profi, návod na mazání a digitalizaci a list náhradních dílů. Model je lehčí než Trix a na první pohled menší, po přeměření ale rozměry souhlasí – naopak Trix je větší než přepočet. Detaily jsou ostřejší a lépe propracované, některé na čelech lokomotivy trochu přemrštěné (jsou ale odnímatelné). Houkačky na střeše jsou jen dvě a na chybném místě, žaluzie na boku jsou konečně správně horizontálně. Hnané jsou čtyři nápravy, proud sbírají všechny; převody jsou částečně z plastu. Interiér kabiny je detailní a říká si o vybarvení.</p><h3>Zhodnocení</h3><p>Špičkový model, u něhož lze několik drobných nedostatků pominout. Jízdní zkoušky přijdou po digitalizaci.</p>',
 i:gi(R+'porovnani_sergej_n_trix_a_fleischmann_38','porovnn_sergej_n_20141214_',[1171481802,1119861410,1680714797,1090969892,1829299449,1748499284,1924750787,1578804103,1682845363])}
};
const gal=a=>`<div class="gal">${a.map(s=>`<img loading="lazy" src="${s}" alt="">`).join('')}</div>`;
const AK=['mz-beckmann','mz-ragulin','mz-sergej2','mz-sergej1'];
const arts=()=>`<div class="arts">${AK.map(k=>`<a class="art" href="#/${k}"><img src="${GL[k].i[GL[k].th]}" alt=""><div><b>${by[k][1]}</b><span>(${GL[k].i.length} obrázků)</span></div></a>`).join('')}</div>
<div class="note"><b>Reportáže – recenze – modelů</b><p>Recenze železničních modelů a reportáže ze světa modelové železnice. Máte k dispozici nový model, který byste chtěli okomentovat nebo recenzovat? Pošlete nám foto s popisem, rádi jej uveřejníme.</p><p>Kontakt: <a href="mailto:reportaze@modelloko.cz">reportaze@modelloko.cz</a></p></div>`;
const $=s=>document.querySelector(s),app=$('#app');
const by=Object.fromEntries(P.map(p=>[p[0],p]));
const href=s=>'#/'+s;

/* menu */
const link=s=>`<a href="${href(s)}" data-s="${s}">${by[s][1]}</a>`;
function menu(){
  const nb=P.filter(p=>p[2]==='nabidka');let g='',nbh='';
  nb.forEach(p=>{if(p[4]!==g){g=p[4];if(g)nbh+=`<small>${g}</small>`}nbh+=link(p[0])});
  const dd=(label,slug,inner)=>`<li><a href="${href(slug)}" data-s="${slug}">${label}</a><div class="dd">${inner}</div></li>`;
  $('#nav').innerHTML='<ul>'+
    dd('Nabídka','nabidka',nbh)+
    dd('Kolejiště','kolejiste',['kolejiste','kolejiste-n-jirny','kolejiste-z-prodejna','kolejiste-prodej'].map(link).join(''))+
    `<li>${link('modelova-zeleznice')}</li><li>${link('zeleznice-reportaze')}</li><li>${link('novinky')}</li><li>${link('odkazy')}</li>`+
    dd('Prodejna','kontakt',['kontakt','kde-nas-najdete','galerie','faq','obchod','mapa-stranek'].map(link).join(''))+'</ul>';
}
/* kousky stránek */
const postCard=p=>`<article class="post"><h3><a href="#/${p.id}">${p.t}</a></h3><p class="date">Vytvořeno: ${p.d}</p>
${p.text?`<p style="margin:0 0 .4rem">${p.text}</p>`:''}
${p.price?`<ul class="prices">${p.price.map(x=>`<li>${x.replace(/(\d[\d ]* Kč)/,'<b>$1</b>')}</li>`).join('')}</ul>`:''}
${p.img.length?`<div class="strip">${p.img.map((s,i)=>`<a href="#/${p.id}"><img loading="lazy" src="${s}" alt="${p.t}, foto ${i+1}"></a>`).join('')}</div>`:''}
<a class="more" href="#/${p.id}">Podrobnosti</a></article>`;
const head=(title,lead,crumbs)=>`<div class="pagehead"><div class="w"><div class="crumb"><a href="#/">Domů</a>${crumbs||''} / ${title}</div><h1 class="pt">${title}</h1><p class="lead">${lead||''}</p></div></div>`;
const empty='<div class="empty">Obsah této sekce se připravuje.</div>';

function home(){
  const sizes=['o','ho','tt','n','z'].map(s=>`<a class="tile sz" href="${href(s)}"><b>${by[s][1]}</b><span>Modelová velikost ${by[s][1]}</span></a>`).join('');
  return `<div class="hero"><div class="w"><h1>Vše pro modelovou železnici</h1>
  <p>Kamenná prodejna v Praze 9 Lehovci: obchod, bazar, servis, modely a příslušenství.</p>
  <a class="btn" href="#/nabidka">Prohlédnout nabídku</a><a class="btn o" href="#/kde-nas-najdete">Kde nás najdete</a></div>
  <svg class="rails" viewBox="0 0 1200 240" preserveAspectRatio="none" aria-hidden="true">
   <defs><path id="a" d="M0 130H1200"/><path id="b" d="M0 130H380C480 130 500 66 600 66H1200"/><path id="c" d="M0 130H380C480 130 500 194 600 194H1200"/></defs>
   <g><use href="#a" class="sl"/><use href="#a" class="tr"/><use href="#b" class="sl"/><use href="#b" class="tr"/><use href="#c" class="sl"/><use href="#c" class="tr"/></g>
   <circle class="m" r="5"><animateMotion dur="9s" repeatCount="indefinite"><mpath href="#a"/></animateMotion></circle>
   <circle class="m" r="5"><animateMotion dur="12s" begin="-4s" repeatCount="indefinite"><mpath href="#b"/></animateMotion></circle>
   <circle class="m" r="5"><animateMotion dur="14s" begin="-9s" repeatCount="indefinite"><mpath href="#c"/></animateMotion></circle>
   <circle class="g" r="4"><animateMotion dur="11s" begin="-2s" repeatCount="indefinite"><mpath href="#a"/></animateMotion></circle>
   <circle class="g" r="4"><animateMotion dur="15s" begin="-7s" repeatCount="indefinite"><mpath href="#b"/></animateMotion></circle>
   <circle class="g" r="4"><animateMotion dur="10s" begin="-5s" repeatCount="indefinite"><mpath href="#c"/></animateMotion></circle>
   <circle class="s" cx="1150" cy="66" r="6"/><circle class="s" cx="1150" cy="130" r="6" style="animation-delay:.8s"/><circle class="s" cx="1150" cy="194" r="6" style="animation-delay:1.6s"/>
  </svg></div>
  <section style="padding-bottom:0"><div class="w"><h2>Vítáme Vás v kamenné prodejně</h2><div class="txt">
  <p>Specializujeme se na sortiment modelové železnice, ale najdete u nás i modely automobilů. Od internetových obchodů se lišíme šíří a objemem zboží, které máme přímo na prodejně.</p>
  <p>Kromě modelů známých světových výrobců nabízíme malosériové a ručně vyráběné modely od našich modelářů – často je to jediný způsob, jak získat model české lokomotivy, vozu, auta nebo doplňku. Jsme výhradním prodejcem lamp českého výrobce Dominik a nechybí literatura, knížky a časopisy o modelářství i velké železnici.</p></div></div></section>
  <section><div class="w"><h2>Modelové velikosti</h2><div class="grid">${sizes}</div></div></section>
  <section style="padding-top:0"><div class="w"><h2>Novinky z prodejny</h2><div class="posts">${POSTS.map(postCard).join('')}</div>
  <div class="pager"><span class="c">1</span>${[2,3,4,5,6,7,8,9,10].map(n=>`<a href="#/novinky">${n}</a>`).join('')}<a href="#/novinky">Následující</a><a href="#/novinky">Konec</a><span style="border:0;background:none;color:var(--muted)">Strana 1 z 15</span></div></div></section>`;
}
function post(p){
  return head(p.t,'Vytvořeno: '+p.d,' / <a href="#/novinky">Novinky</a>')+`<section><div class="w">${p.text?`<p>${p.text}</p>`:''}
  ${p.price?`<ul class="prices">${p.price.map(x=>`<li>${x.replace(/(\d[\d ]* Kč)/,'<b>$1</b>')}</li>`).join('')}</ul>`:''}
  ${p.img.length?`<div class="gal">${p.img.map((s,i)=>`<img loading="lazy" src="${s}" alt="${p.t}, foto ${i+1}">`).join('')}</div>`:''}
  <p style="margin-top:2rem"><a class="more" href="#/novinky">← Zpět na novinky</a></p></div></section>`;
}
function generic(s){
  const p=by[s],kids=P.filter(x=>x[2]===s),par=p[2]?` / <a href="${href(p[2])}">${by[p[2]][1]}</a>`:'';
  const title=p[4]==='Modelové velikosti'?'Modelová velikost '+p[1]:p[1];
  let body=kids.length?`<div class="grid">${kids.map(k=>`<a class="tile" href="${href(k[0])}"><b>${k[1]}</b><span>${k[3]}</span></a>`).join('')}</div>`:empty;
  if(s==='lampy-dominik')body=`<div class="dom"><img src="https://modelloko.cz/images/loga/dominik_logo.png" alt="lampy Dominik"><p style="margin:0"><b>ModelLOKO je výhradní prodejce lamp Dominik.</b></p></div>`+empty;
  if(s==='novinky'||s==='obchod')body=`<div class="posts">${POSTS.map(postCard).join('')}</div>`;
  if(s==='kontakt')body=`<div class="info"><div><h3>Adresa</h3><p>Modelloko<br>Kardašovská 753<br>Praha 9 Lehovec<br>198 00</p></div><div><h3>Telefon</h3><p><a href="tel:+420281862403">281 862 403</a></p></div><div><h3>Email</h3><p><a href="mailto:psevcik@modelloko.cz">psevcik@modelloko.cz</a></p></div></div>`;
  if(s==='kde-nas-najdete')body=`<div class="info"><div><h3>Adresa prodejny</h3><p>Kardašovská 753<br>Praha 9 Lehovec, 198 00</p></div><div><h3>Mapa</h3><p><a href="https://mapy.cz/zakladni?q=Karda%C5%A1ovsk%C3%A1%20753%2C%20Praha" target="_blank" rel="noopener">Otevřít v Mapy.cz</a></p></div><div><h3>Telefon</h3><p><a href="tel:+420281862403">281 862 403</a></p></div></div>`;
  if(s==='mapa-stranek')body=`<div class="sm"><ul><li><a href="#/">Domů</a></li>${P.map(x=>`<li><a href="${href(x[0])}">${x[1]}</a></li>`).join('')}${POSTS.map(x=>`<li><a href="#/${x.id}">${x.t}</a></li>`).join('')}</ul></div>`;
  if(GL[s]){const g=GL[s];body=(g.h?`<h2>${g.h}</h2>`:'')+(g.x?`<div class="txt">${g.x}</div>`:'')+gal(g.i)}
  if(s==='modelova-zeleznice'||s==='zeleznice-reportaze')body=arts();
  return head(title,GL[s]?'':p[3],par)+`<section><div class="w">${body}</div></section>`;
}
function render(){
  const s=(location.hash.replace(/^#\/?/,'')||'');let html,t='MODEL LOKO – prodejna modelové železnice';
  const po=POSTS.find(x=>x.id===s);
  if(!s)html=home();else if(po){html=post(po);t=po.t+' | MODEL LOKO'}else if(by[s]){html=generic(s);t=by[s][1]+' | MODEL LOKO'}
  else html=head('Stránka nenalezena','Tuto stránku jsme nenašli.')+'<section><div class="w"><a class="btn" href="#/">Zpět na úvod</a></div></section>';
  app.innerHTML=html;document.title=t;window.scrollTo(0,0);
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.s===s));
  $('#nav').classList.remove('open');$('#bg').setAttribute('aria-expanded','false');
}
const lb=document.createElement('div');lb.id='lb';lb.hidden=true;document.body.appendChild(lb);
lb.onclick=()=>lb.hidden=true;addEventListener('keydown',e=>{if(e.key==='Escape')lb.hidden=true});
app.addEventListener('click',e=>{if(e.target.matches('.gal img')){lb.innerHTML='<img src="'+e.target.src+'" alt="">';lb.hidden=false}});
menu();render();addEventListener('hashchange',render);
$('#bg').onclick=()=>{const o=$('#nav').classList.toggle('open');$('#bg').setAttribute('aria-expanded',o)};
</script>
</body>
</html>
